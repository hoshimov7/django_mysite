<div class="pagination">
    <span class="step-links">
        {% if page.has_previous %}
            <a href="?q={{ page.previous_page_number }}">Previous</a>
        {% endif %}
        <spam class="current">
            Page {{ page.number }} of {{ page.paginator.pag_nums }}.
        </spam>
        {% if page.has_next %}
            <a href="?page={{ page.next_page_number }}">Next</a>
        {% endif %}

    </span>
    
</div>
